name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages
        run: npm run build-all

      - name: Debug npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Active npm config ==="
          npm config list

          echo ""
          echo "=== Project .npmrc ==="
          cat .npmrc 2>/dev/null || echo "(not found)"

          echo ""
          echo "=== User ~/.npmrc ==="
          cat ~/.npmrc 2>/dev/null || echo "(not found)"

          echo ""
          echo "=== Token identity (GitHub API) ==="
          curl -sf -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            https://api.github.com/user | grep -E '"login"|"type"' || echo "API call failed"

          echo ""
          echo "=== npm info ds-button (verbose) ==="
          npm info @karinmelissa/ds-button --loglevel verbose 2>&1 || true

          echo ""
          echo "=== npm info ds-tokens (verbose) ==="
          npm info @karinmelissa/ds-tokens --loglevel verbose 2>&1 || true

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
